version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    groups:
      docker-images:
        patterns: ['*']
    # A major version of a database is never upgraded by an automatic PR: data volumes
    # created by one major version cannot be opened by another without a migration, and
    # compatibility with Prisma and BullMQ must be checked first (see docs/06-local-services.md).
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
      - dependency-name: redis
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    groups:
      dev-dependencies:
        patterns: ['*']
    # Major upgrades that are blocked by compatibility (see docs/04-code-quality.md):
    # typescript-eslint does not support TypeScript 7 yet, and eslint-plugin-jsx-a11y
    # does not support ESLint 10 yet. Remove these entries when that changes.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
