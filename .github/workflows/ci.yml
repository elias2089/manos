name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow can only read the repository
permissions:
  contents: read

# A new push to the same pull request cancels the previous run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Throwaway database for the integration tests. Keep the image and digest in sync with
    # docker-compose.yml: Dependabot does not update this one. The password is not a secret:
    # the database lives a few minutes on a runner that is destroyed afterwards.
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: manos
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: manos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manos -d manos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from the "packageManager" field in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails instead of rewriting the lockfile if it is out of date
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint:root
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://manos:ci-only-password@127.0.0.1:5432/manos_test

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so secrets removed in a later commit are still found
          fetch-depth: 0
          persist-credentials: false

      - run: sh scripts/gitleaks.sh history
