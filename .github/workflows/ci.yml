name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow can only read the repository
permissions:
  contents: read

# A new push to the same pull request cancels the previous run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from the "packageManager" field in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails instead of rewriting the lockfile if it is out of date
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint:root
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so secrets removed in a later commit are still found
          fetch-depth: 0
          persist-credentials: false

      - run: sh scripts/gitleaks.sh history
